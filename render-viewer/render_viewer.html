<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Render Viewer</title>
<style>
  :root { --bg: #111418; --panel: #1b2027; --line: #2c333d; --text: #e8ecf1; --dim: #8a94a3; --accent: #4fa3ff; --live: #3ddc84; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, system-ui, sans-serif;
         display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; }
  aside h1 { font-size: 15px; margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .dir { padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .dir:hover { background: #222832; }
  .dir.on { background: #24303f; box-shadow: inset 3px 0 var(--accent); }
  .dir .name { word-break: break-all; }
  .dir .meta { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .live { color: var(--live); font-weight: 600; }
  main { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header .title { font-weight: 600; word-break: break-all; }
  header label { color: var(--dim); display: flex; gap: 6px; align-items: center; }
  header button, header select { background: #24303f; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
                                 padding: 5px 12px; font: inherit; cursor: pointer; }
  header button.on { background: var(--accent); color: #06121f; border-color: var(--accent); }
  .stage { display: flex; align-items: center; justify-content: center; min-height: 0; padding: 12px; }
  .stage img { max-width: 100%; max-height: 100%; object-fit: contain; border: 1px solid var(--line);
               background: repeating-conic-gradient(#3a3f47 0 25%, #2a2e35 0 50%) 0 0 / 24px 24px; }
  .strip { display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px; border-top: 1px solid var(--line); }
  .strip img { height: 110px; cursor: pointer; border: 2px solid transparent; flex: none;
               background: repeating-conic-gradient(#3a3f47 0 25%, #2a2e35 0 50%) 0 0 / 12px 12px; }
  .strip img.on { border-color: var(--accent); }
  .empty { color: var(--dim); padding: 16px; }
  @media (max-width: 700px) { body { grid-template-columns: 1fr; grid-template-rows: 180px 1fr; } }
</style>
</head>
<body>
<aside>
  <h1>Render folders</h1>
  <div id="dirs"><div class="empty">Looking…</div></div>
</aside>
<main>
  <header>
    <span class="title" id="title">—</span>
    <span id="count"></span>
    <button id="play">▶ Play</button>
    <select id="fps"><option value="30" selected>30 fps (real speed)</option><option value="15">15 fps</option><option value="5">5 fps</option></select>
    <input type="range" id="scrub" min="0" max="0" value="0" style="flex:1;min-width:160px">
    <label><input type="checkbox" id="follow" checked> follow newest frame</label>
  </header>
  <div class="stage"><img id="big" alt=""></div>
  <div class="strip" id="strip"></div>
</main>
<script>
let cur = null, frames = [], shown = null;
const $ = id => document.getElementById(id);
const img = name => `/img?p=${encodeURIComponent(cur + '/' + name)}`;
const ago = s => s < 60 ? `${Math.round(s)} s ago` : s < 3600 ? `${Math.round(s / 60)} min ago` : `${(s / 3600).toFixed(1)} h ago`;

let playing = null, cache = {};
function src(name) {                                 // frames never change once written: cache each one for playback
  if (!cache[name]) { cache[name] = new Image(); cache[name].src = img(name); }
  return cache[name].src;
}

function show(name) {
  shown = name;
  $('big').src = src(name);
  $('scrub').value = frames.indexOf(name);
  $('title').textContent = cur + '/' + name;
  for (const el of $('strip').children) el.classList.toggle('on', el.dataset.n === name);
}

async function pollDirs() {
  const dirs = await (await fetch('/api/dirs')).json();
  if (!cur && dirs.length) cur = dirs[0].dir;
  $('dirs').innerHTML = dirs.length ? '' : '<div class="empty">No frames written in the last 6 h.</div>';
  for (const d of dirs) {
    const el = document.createElement('div');
    el.className = 'dir' + (d.dir === cur ? ' on' : '');
    const live = d.age_s < 60 ? '<span class="live">● rendering</span> · ' : '';
    const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = d.dir;
    const mt = document.createElement('div'); mt.className = 'meta';
    mt.innerHTML = live; mt.append(`${d.count} frames · last ${d.last} · ${ago(d.age_s)}`);
    el.append(nm, mt);
    el.dataset.dir = d.dir;
    $('dirs').appendChild(el);
  }
}

async function pollFrames() {
  if (!cur) return;
  const names = await (await fetch('/api/frames?dir=' + encodeURIComponent(cur))).json();
  const fresh = names.slice(frames.length);
  frames = names;
  $('scrub').max = Math.max(0, names.length - 1);
  $('count').textContent = `${names.length} frames`;
  for (const n of fresh) {
    const t = document.createElement('img');
    t.loading = 'lazy'; t.dataset.n = n; t.src = src(n); t.title = n;
    t.onclick = () => { stop(); $('follow').checked = false; show(n); };
    $('strip').appendChild(t);
  }
  if (names.length && ($('follow').checked || !shown)) {
    if (shown !== names.at(-1)) { show(names.at(-1)); $('strip').scrollLeft = $('strip').scrollWidth; }
  }
}

function stop() { clearInterval(playing); playing = null; $('play').textContent = '▶ Play'; $('play').classList.remove('on'); }
function play() {
  if (playing) return stop();
  if (!frames.length) return;
  $('follow').checked = false;
  frames.forEach(src);                               // start loading every frame now
  let i = Math.max(0, frames.indexOf(shown));
  if (i >= frames.length - 1) i = 0;
  $('play').textContent = '❚❚ Pause'; $('play').classList.add('on');
  playing = setInterval(() => { show(frames[i]); i = (i + 1) % frames.length; }, 1000 / +$('fps').value);
}
$('play').onclick = play;
$('fps').onchange = () => { if (playing) { stop(); play(); } };
$('scrub').oninput = () => { stop(); $('follow').checked = false; show(frames[+$('scrub').value]); };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  const i = frames.indexOf(shown);
  if (e.code === 'Space') { e.preventDefault(); play(); }
  else if (e.code === 'ArrowRight' && i < frames.length - 1) { stop(); $('follow').checked = false; show(frames[i + 1]); }
  else if (e.code === 'ArrowLeft' && i > 0) { stop(); $('follow').checked = false; show(frames[i - 1]); }
});

// the list is rebuilt every poll, so a click handler on a row can be lost mid-click: act on the press, on the container
$('dirs').addEventListener('pointerdown', e => {
  const row = e.target.closest('.dir');
  if (!row || row.dataset.dir === cur) return;
  stop(); cache = {}; cur = row.dataset.dir; frames = []; shown = null; $('strip').innerHTML = '';
  pollFrames(); pollDirs();
});

async function tick() {
  try { await pollDirs(); await pollFrames(); } catch (e) { $('count').textContent = 'viewer server not reachable'; }
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
